<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Object Detection</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#0f172a;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        width:55%;
        max-width:900px;
        padding:20px;
        border-radius:20px;
        text-align:center;
        box-shadow:0 0 25px rgba(0,0,0,0.5);
    }

    h1{
        margin-bottom:20px;
        color:#e56916;
    }

    .video-box{
        position:relative;
        width:100%;
        overflow:hidden;
        border-radius:15px;
        border:3px solid #48c126;
    }

    img{
        width:100%;
        border-radius:15px;
    }

    .controls{
        margin-top:20px;
        display:flex;
        justify-content:center;
        gap:15px;
        flex-wrap:wrap;
    }

    button{
        padding:12px 20px;
        border:none;
        border-radius:10px;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    .start{
        background:#22c55e;
        color:white;
    }

    .stop{
        background:#ef4444;
        color:white;
    }

    button:hover{
        transform:scale(1.05);
    }

    .status{
        margin-top:30px;
        font-size:18px;
        color:#facc15;
    }

    footer{
        margin-top:20px;
        font-size:18px;
        color:#90f920;
    }
</style>
</head>

<body style="background-image: url('https://i.ibb.co/5WxWJP3b/img.webp'); 
             background-size: cover; 
             background-position: center; 
             background-repeat: no-repeat;">

<div class="container">

    <h1>AI Detection System</h1>

    <div class="video-box">
        <!-- Flask video stream -->
        <p>Video feed</p>
    </div>

    <div class="controls">
        <button class="start" onclick="startDetection()">
            Start Detection
        </button>

        <button class="stop" onclick="stopDetection()">
            Stop Detection
        </button>
    </div>

    <div class="status" id="status">
        System Ready
    </div>

    <footer>
        Real-Time  Detection
    </footer>

</div>

<script>

function startDetection(){
    
    document.getElementById("status").innerHTML =
        "Please wait detection will start in 13 seconds...";

    fetch('/start')

    .then(response => response.text())

    .then(data => {
        alert(data);
    });

}
function stopDetection(){
    document.getElementById("status").innerHTML =
        "Press Esc button to stop the detection...";
}
</script>

</body>
</html>
